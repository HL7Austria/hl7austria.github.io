y="0.50196"></ellipse><path d="M221,741.4136 L221,768.4136 M208,749.4136 L234,749.4136 M221,768.4136 L208,783.4136 M221,768.4136 L234,783.4136 " style="stroke:#181818;stroke-width:0.5;" fill="none"></path><rect rx="5" ry="5" width="196" x="474" y="87.0986" style="stroke:#555555;stroke-width:0.5;" fill="#E97132" fill-opacity="0.50196" height="30.0986"></rect><text lengthAdjust="spacing" x="481" font-size="14" textLength="182" y="107.2305" font-family="Arial" fill="#000000">e-Diagnose Fachanwendung</text><rect rx="5" ry="5" width="196" x="474" y="708.8149" style="stroke:#555555;stroke-width:0.5;" fill="#E97132" fill-opacity="0.50196" height="30.0986"></rect><text lengthAdjust="spacing" x="481" font-size="14" textLength="182" y="728.9468" font-family="Arial" fill="#000000">e-Diagnose Fachanwendung</text><rect width="10" x="216" y="128.1973" style="stroke:#181818;stroke-width:1.0;" fill="#156082" fill-opacity="0.50196" height="572.6177"></rect><rect width="10" x="567" y="128.1973" style="stroke:#181818;stroke-width:1.0;" fill="#E97132" fill-opacity="0.50196" height="572.6177"></rect><path d="M5,138.1973 L5,234.1973 A5,5 0 0 0 10,239.1973 L433,239.1973 A5,5 0 0 0 438,234.1973 L438,143.1973 L428,133.1973 L10,133.1973 A5,5 0 0 0 5,138.1973 " style="stroke:#8B95A5;stroke-width:1.0;" fill="url(#g1mprhrocegt880)"></path><path d="M428,133.1973 L428,140.6973 A2.5,2.5 0 0 0 430.5,143.1973 L438,143.1973 L428,133.1973 " style="stroke:#8B95A5;stroke-width:1.0;" fill="url(#g1mprhrocegt880)"></path><text lengthAdjust="spacing" x="11" font-size="14" textLength="295" y="151.3291" font-family="Arial" fill="#111827">Vorbedingung: Im System des GDA 1 liegt eine</text><text lengthAdjust="spacing" x="11" font-size="14" textLength="408" y="167.4277" font-family="Arial" fill="#111827">bestehende Ressource (Condition/Procedure/AllergyIntolerance)</text><text lengthAdjust="spacing" x="11" font-size="14" textLength="300" y="183.5264" font-family="Arial" fill="#111827">vor, die in eine Liste aufgenommen werden soll.</text><text lengthAdjust="spacing" x="11" font-size="14" textLength="4" y="199.625" font-family="Arial" fill="#111827">&nbsp;</text><text lengthAdjust="spacing" x="11" font-size="14" textLength="307" y="215.7236" font-family="Arial" fill="#111827">Diese kann gerade erst erstellt worden sein oder</text><text lengthAdjust="spacing" x="11" font-size="14" textLength="299" y="231.8223" font-family="Arial" fill="#111827">aus der Gesamtansicht abgerufen worden sein.</text><rect rx="5" ry="5" width="499" x="194" y="244.7891" style="stroke:#000000;stroke-width:1.5;" fill="none" height="42.1973"></rect><path d="M199,244.7891 L259,244.7891 L259,252.7891 L249,262.7891 L194,262.7891 L194,249.7891 A5,5 0 0 1 199,244.7891 " style="stroke:#000000;stroke-width:2.0;" fill="#EEEEEE"></path><text font-weight="bold" lengthAdjust="spacing" x="207" font-size="14" textLength="20" y="259.9209" font-family="Arial" fill="#000000">ref</text><a xlink:type="simple" xlink:show="new" xlink:title="uc_ediag_06_int_list.html#$list-read" href="uc_ediag_06_int_list.html#$list-read" xlink:actuate="onRequest" title="uc_ediag_06_int_list.html#$list-read" xlink:href="uc_ediag_06_int_list.html#$list-read" target="_top"><text lengthAdjust="spacing" x="414" font-size="14" textLength="59" y="279.9209" font-family="Arial" fill="#0000EE">$list-read</text></a><path d="M63,301.9863 L63,349.9863 A5,5 0 0 0 68,354.9863 L374,354.9863 A5,5 0 0 0 379,349.9863 L379,306.9863 L369,296.9863 L68,296.9863 A5,5 0 0 0 63,301.9863 " style="stroke:#8B95A5;stroke-width:1.0;" fill="url(#g1mprhrocegt880)"></path><path d="M369,296.9863 L369,304.4863 A2.5,2.5 0 0 0 371.5,306.9863 L379,306.9863 L369,296.9863 " style="stroke:#8B95A5;stroke-width:1.0;" fill="url(#g1mprhrocegt880)"></path><text lengthAdjust="spacing" x="69" font-size="14" textLength="260" y="315.1182" font-family="Arial" fill="#111827">GDA erhält ein Collection-Bundle von der</text><text lengthAdjust="spacing" x="69" font-size="14" textLength="295" y="331.2168" font-family="Arial" fill="#111827">Fachanwendung und bearbeitet die enthaltene</text><text lengthAdjust="spacing" x="69" font-size="14" textLength="99" y="347.3154" font-family="Arial" fill="#111827">List-Ressource.</text><line y1="381.231" x1="226" y2="381.231" style="stroke:#111827;stroke-width:1.0;" x2="268"></line><line y1="381.231" x1="268" y2="394.231" style="stroke:#111827;stroke-width:1.0;" x2="268"></line><line y1="394.231" x1="227" y2="394.231" style="stroke:#111827;stroke-width:1.0;" x2="268"></line><polygon style="stroke:#111827;stroke-width:1.0;" fill="#111827" points="237,390.231,227,394.231,237,398.231,233,394.231"></polygon><text font-weight="bold" lengthAdjust="spacing" x="233" font-size="13" textLength="7" y="376.4761" font-family="Arial" fill="#000000">1</text><text lengthAdjust="spacing" x="244" font-size="13" textLength="200" y="376.4761" font-family="Arial" fill="#000000">Bestehende Ressource auswählen</text><line y1="453.0771" x1="226" y2="453.0771" style="stroke:#111827;stroke-width:1.0;" x2="268"></line><line y1="453.0771" x1="268" y2="466.0771" style="stroke:#111827;stroke-width:1.0;" x2="268"></line><line y1="466.0771" x1="227" y2="466.0771" style="stroke:#111827;stroke-width:1.0;" x2="268"></line><polygon style="stroke:#111827;stroke-width:1.0;" fill="#111827" points="237,462.0771,227,466.0771,237,470.0771,233,466.0771"></polygon><text font-weight="bold" lengthAdjust="spacing" x="233" font-size="13" textLength="7" y="433.3735" font-family="Arial" fill="#000000">2</text><text lengthAdjust="spacing" x="244" font-size="13" textLength="120" y="418.4248" font-family="Arial" fill="#000000">List.entry hinzufügen</text><text lengthAdjust="spacing" x="244" font-size="13" textLength="125" y="433.3735" font-family="Arial" fill="#000000">- List.entry.flag = new</text><text lengthAdjust="spacing" x="244" font-size="13" textLength="316" y="448.3223" font-family="Arial" fill="#000000">- List.entry.item = Referenz auf bestehende Ressource</te